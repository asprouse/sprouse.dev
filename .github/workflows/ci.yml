name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate resume.json against schema
        run: npm run validate:resume

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Astro typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
